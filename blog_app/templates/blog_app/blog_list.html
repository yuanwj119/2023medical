<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>
    <!-- 引入Bootstrap的CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 2rem;
            background-color: #f8f9fa;
        }
        .article-card {
            margin-bottom: 1.5rem;
            border-radius: 0.5rem;
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        .article-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .article-date {
            color: #6c757d;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="mb-5">
            <h1 class="text-center">{{ page_title }}</h1>
            <hr>
        </header>
        
        <main>
            {% if articles %}  
                <div class="row">
                    {% for article in articles %}
                        <div class="col-md-6 col-lg-4">
                            <div class="card article-card">
                                <div class="card-body">
                                    <h2 class="card-title"><a href="{% url 'blog_app:blog_detail' article.id %}">{{ article.title }}</a></h2>
                                    <p class="article-date">作者: {{ article.author.username }} | 创建时间: {{ article.created_at|date:"Y-m-d H:i" }}</p>
                                    <p class="card-text">{{ article.content|truncatewords:50 }}</p>
                                    <a href="{% url 'blog_app:blog_detail' article.id %}" class="btn btn-primary">阅读全文</a>
                                </div>
                            </div>
                        </div>
                    {% endfor %}
                </div>
            {% else %}
                <div class="alert alert-info text-center">
                    <p>暂无博客文章</p>
                </div>
            {% endif %}
        </main>
        
        <footer class="mt-5 pt-5 border-top">
            <div class="text-center">
                <p>&copy; 2024 个人博客系统</p>
                <p><a href="{% url 'blog_app:author_list' %}">查看所有作者</a></p>
            </div>
        </footer>
    </div>

    <!-- 引入Bootstrap的JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
